apiVersion: 1
datasources:
  - name: Astral PostgreSQL
    uid: astral-postgres
    type: postgres
    access: proxy
    url: 127.0.0.1:5432
    user: astral_grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: ${ASTRAL_GRAFANA_DB_NAME}
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 5
    secureJsonData:
      password: ${ASTRAL_GRAFANA_READER_PASSWORD}
