# Perfil de DESENVOLVIMENTO.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Aqui mora so o que e'comfortavel em dev e atrapalharia em producao: log
# verboso, SQL impresso, detalhe de health. O que e' verdade sobre o sistema --
# ddl-auto, Flyway, defaults do ACL, cookie, TLS -- fica no application.yml e
# NAO e' repetido aqui. Perfil que reescreve regra de seguranca vira uma segunda
# fonte de verdade, e a segunda fonte de verdade sempre acaba divergindo.

spring:
  jpa:
    show-sql: true

  thymeleaf:
    cache: false

management:
  endpoint:
    health:
      # always, e' nao when_authorized: aqui nao ha usuario, e um health que
      # esconde informacao nao serve para diagnosticar nada.
      show-details: always

astral:
  audit:
    fallback-file: "${ASTRAL_AUDIT_FALLBACK:${java.io.tmpdir}/astral/audit-fallback.jsonl}"

logging:
  level:
    root: INFO
    com.astral: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    com.astral.fabric.proxy: TRACE
