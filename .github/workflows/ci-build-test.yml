name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-platform-hci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-rust:
    name: Rust + React build, rollback tests and HTTP smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test deployment and rollback
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Cargo check
        run: cargo check --all-targets --locked

      - name: Run Cargo tests
        run: cargo test --verbose --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Smoke test actual release and frontend
        run: python3 scripts/smoke-platform.py

      - name: Checkout tested auth-service for OAuth2 integration
        uses: actions/checkout@v4
        with:
          repository: euripedesdark/auth-service
          ref: d5ecf4eb780adfdd901b72a1ae9b8099433b42e1
          path: oauth-auth-service

      - name: Build OAuth2 provider
        run: cargo build --release --locked --manifest-path oauth-auth-service/Cargo.toml

      - name: Install nginx for auth_request regression
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Test real OAuth2 servers behind nginx against disposable LDAPS
        run: python3 scripts/test-oauth-e2e.py --auth-binary oauth-auth-service/target/release/astral-auth-service --nginx-binary /usr/sbin/nginx
