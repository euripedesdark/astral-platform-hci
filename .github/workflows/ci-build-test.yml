name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-platform-hci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-rust:
    name: Rust + React build, rollback tests and HTTP smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test deployment and rollback
        run: python3 -m unittest discover -s scripts/tests -p test_platform_deploy.py -v

      - name: Cargo check
        run: cargo check --all-targets --locked

      - name: Run Cargo tests
        run: cargo test --verbose --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Smoke test actual release and frontend
        run: python3 scripts/smoke-platform.py
